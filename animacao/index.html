<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Três Amigas Mágicas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #f6f1fb;
    --ink: #3b2a52;
    --muted: #7b6b8f;
    --panel: #ffffff;
    --accent: #9b6fd6;
    --accent-ink: #ffffff;
    --line: #e4d9f2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #1b1724; --ink: #efe6fb; --muted: #b3a6c6; --panel: #262033;
      --accent: #b28be8; --accent-ink: #1b1724; --line: #3a3149;
    }
  }
  :root[data-theme="dark"] {
    --page: #1b1724; --ink: #efe6fb; --muted: #b3a6c6; --panel: #262033;
    --accent: #b28be8; --accent-ink: #1b1724; --line: #3a3149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font-family: 'Baloo 2', system-ui, sans-serif;
  }
  main { max-width: 1280px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: clamp(22px, 4vw, 34px); margin: 0 0 4px; line-height: 1.1; }
  p.sub { margin: 0 0 16px; color: var(--muted); }
  .stage {
    width: 100%; aspect-ratio: 16 / 9; border-radius: 18px; overflow: hidden;
    box-shadow: 0 10px 40px rgba(60, 30, 90, .18); background: #cbb6ef;
  }
  .stage svg { display: block; width: 100%; height: 100%; }
  .controls {
    display: flex; gap: 10px; align-items: center; margin-top: 14px; flex-wrap: wrap;
  }
  .controls button {
    font: inherit; font-weight: 800; font-size: 16px; border: 0; border-radius: 999px;
    padding: 8px 18px; background: var(--accent); color: var(--accent-ink); cursor: pointer;
  }
  .controls button.secondary { background: var(--panel); color: var(--ink); border: 2px solid var(--line); }
  .controls input[type=range] { flex: 1 1 200px; accent-color: var(--accent); min-width: 0; }
  .controls .time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 92px; text-align: right; }

  /* Render mode: only the 1280x720 stage, used for exporting video frames */
  body.render main { padding: 0; max-width: none; }
  body.render h1, body.render p.sub, body.render .controls { display: none; }
  body.render .stage { width: 1280px; height: 720px; border-radius: 0; box-shadow: none; }
  body.vertical .stage { aspect-ratio: 9 / 16; max-width: 420px; margin: 0 auto; }
  body.vertical .controls { max-width: 420px; margin-left: auto; margin-right: auto; }
  body.render.vertical .stage { width: 720px; height: 1280px; max-width: none; }
  .formats { display: flex; gap: 8px; margin: 0 0 14px; flex-wrap: wrap; }
  .formats a {
    text-decoration: none; font-weight: 800; padding: 4px 14px; border-radius: 999px;
    border: 2px solid var(--line); color: var(--ink); background: var(--panel);
  }
  .formats a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  body.render .formats { display: none; }

  /* ---------- SVG animation keyframes ---------- */
  svg text { font-family: 'Baloo 2', 'DejaVu Sans', sans-serif; font-weight: 800; }
  .hidden0 { opacity: 0; }

  @keyframes bob       { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
  @keyframes walkBounce{ 0%,100% { transform: translateY(0) } 50% { transform: translateY(-14px) } }
  @keyframes walkInL   { from { transform: translateX(-780px) } to { transform: translateX(0) } }
  @keyframes hopInR {
    0%   { transform: translate(780px, 0) }
    12%  { transform: translate(650px, -70px) }
    25%  { transform: translate(520px, 0) }
    37%  { transform: translate(400px, -70px) }
    50%  { transform: translate(280px, 0) }
    62%  { transform: translate(170px, -60px) }
    75%  { transform: translate(70px, 0) }
    87%  { transform: translate(20px, -24px) }
    100% { transform: translate(0, 0) }
  }
  @keyframes magicIn {
    0%   { transform: scale(0);    opacity: 0 }
    55%  { transform: scale(1.12); opacity: 1 }
    78%  { transform: scale(.96);  opacity: 1 }
    100% { transform: scale(1);    opacity: 1 }
  }
  @keyframes hop   { 0%,100% { transform: translateY(0) } 40% { transform: translateY(-34px) } 70% { transform: translateY(0) } 85% { transform: translateY(-6px) } }
  @keyframes jump  { 0%,60%,100% { transform: translateY(0) } 30% { transform: translateY(-60px) } }
  @keyframes wave {
    0%   { transform: rotate(0) }
    12%  { transform: rotate(150deg) }
    22%  { transform: rotate(128deg) }
    32%  { transform: rotate(160deg) }
    42%  { transform: rotate(128deg) }
    52%  { transform: rotate(160deg) }
    62%  { transform: rotate(130deg) }
    72%  { transform: rotate(155deg) }
    88%  { transform: rotate(150deg) }
    100% { transform: rotate(0) }
  }
  @keyframes armsUp {
    0%   { transform: rotate(0) }
    14%  { transform: rotate(160deg) }
    28%  { transform: rotate(140deg) }
    42%  { transform: rotate(160deg) }
    56%  { transform: rotate(140deg) }
    70%  { transform: rotate(160deg) }
    86%  { transform: rotate(150deg) }
    100% { transform: rotate(0) }
  }
  @keyframes hug {
    0%   { transform: rotate(0) }
    20%  { transform: rotate(95deg) }
    35%  { transform: rotate(80deg) }
    50%  { transform: rotate(95deg) }
    65%  { transform: rotate(80deg) }
    80%  { transform: rotate(90deg) }
    100% { transform: rotate(0) }
  }
  @keyframes talk      { from { transform: scaleY(1) } to { transform: scaleY(2.1) } }
  @keyframes talkSmall { from { transform: scaleY(1) } to { transform: scaleY(.72) } }
  @keyframes blink     { 0%,92%,100% { transform: scaleY(1) } 95% { transform: scaleY(.08) } }
  @keyframes sway      { 0%,100% { transform: rotate(-1.4deg) } 50% { transform: rotate(1.4deg) } }
  @keyframes tilt      { 0%,100% { transform: rotate(-2deg) } 50% { transform: rotate(2deg) } }
  @keyframes life {
    0%   { opacity: 0; transform: scale(.4) }
    6%   { opacity: 1; transform: scale(1.06) }
    10%  { opacity: 1; transform: scale(1) }
    92%  { opacity: 1; transform: scale(1) }
    100% { opacity: 0; transform: scale(.9) }
  }
  @keyframes popIn {
    0%   { opacity: 0; transform: scale(.4) }
    60%  { opacity: 1; transform: scale(1.06) }
    100% { opacity: 1; transform: scale(1) }
  }
  @keyframes fadeIn    { from { opacity: 0 } to { opacity: 1 } }
  @keyframes burstOut {
    0%   { opacity: 0; transform: translateX(20px) scale(.3) }
    15%  { opacity: 1 }
    100% { opacity: 0; transform: translateX(260px) scale(1.2) rotate(90deg) }
  }
  @keyframes flash     { 0% { opacity: 0; transform: scale(.2) } 30% { opacity: .95 } 100% { opacity: 0; transform: scale(2.4) } }
  @keyframes twinkle   { 0%,100% { opacity: .15; transform: scale(.5) } 50% { opacity: 1; transform: scale(1) } }
  @keyframes fall {
    0%   { opacity: 1; transform: translateY(-60px) rotate(0) }
    100% { opacity: 1; transform: translateY(800px) rotate(320deg) }
  }
  @keyframes glow {
    0% { opacity: 0 } 15% { opacity: 1 } 30% { opacity: .55 } 45% { opacity: 1 }
    60% { opacity: .55 } 75% { opacity: 1 } 100% { opacity: 0 }
  }
  @keyframes exitL     { to { transform: translateX(-900px) } }
  @keyframes exitR     { to { transform: translateX(900px) } }
  @keyframes exitPop   { 0% { transform: scale(1); opacity: 1 } 30% { transform: scale(1.08); opacity: 1 } 100% { transform: scale(0); opacity: 0 } }
  @keyframes drift     { 0%,100% { transform: translateX(-24px) } 50% { transform: translateX(24px) } }
</style>
</head>
<body>
<main>
  <h1>Laisa, Louise &amp; Letícia</h1>
  <p class="sub">Episódio 1 · As Três Amigas Mágicas — animação de 34 segundos</p>
  <nav class="formats" aria-label="Formato">
    <a href="?" id="fmtH">Horizontal 16:9 (YouTube)</a>
    <a href="?formato=vertical" id="fmtV">Vertical 9:16 (Shorts / Reels)</a>
  </nav>
  <div class="stage"><svg id="svg" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" aria-label="Animação das personagens Laisa, Louise e Letícia"></svg></div>
  <div class="controls">
    <button id="play">Pausar</button>
    <button id="replay" class="secondary">Recomeçar</button>
    <input id="scrub" type="range" min="0" max="34" step="0.01" value="0" aria-label="Linha do tempo">
    <span class="time" id="time">0.0s / 34s</span>
  </div>
</main>

<script>
const TOTAL = 34; // segundos

// ---------- Paleta das personagens (baseada nas fichas) ----------
const CH = {
  laisa: {
    skin: '#c98b5f', shade: '#a96d45', hair: '#2a1913', hairHi: '#4a2e22', streak: '#8fc6dc',
    shirt: '#b48be0', overall: '#f19bc1', overallDark: '#d8749f', blush: '#e5786a', type: 'long'
  },
  louise: {
    skin: '#c98b5f', shade: '#a96d45', hair: '#5b3325', hairHi: '#7a4a37', streak: '#ef8db0',
    shirt: '#f8e27a', overall: '#9fcbe6', overallDark: '#6fa3c8', blush: '#e5786a', type: 'long'
  },
  leticia: {
    skin: '#6e3f2b', shade: '#55301f', hair: '#1c120d', hairHi: '#3a2519',
    shirt: '#fcf2df', trim: '#f2a7bf', blush: '#b4584f', type: 'afro'
  }
};

// ---------- Utilidades ----------
const anim = (name, dur, delay = 0, iter = 1, fill = 'none', ease = 'ease-in-out', dir = 'normal') =>
  `${name} ${dur}s ${ease} ${delay}s ${iter} ${dir} ${fill}`;
const st = (origin, ...anims) =>
  `style="transform-origin:${origin};${anims.length ? 'animation:' + anims.join(',') : ''}"`;
const MIRROR = 'transform="translate(360,0) scale(-1,1)"';

// ---------- Desenho das personagens (coordenadas locais 360 x 560) ----------
function hairBack(o) {
  let s = '';
  if (o.type === 'long') {
    s += `<ellipse cx="180" cy="215" rx="128" ry="150" fill="${o.hair}"/>`;
    for (let i = 0; i < 24; i++) {
      const a = i / 24 * Math.PI * 2;
      const x = 180 + 132 * Math.cos(a), y = 215 + 156 * Math.sin(a);
      s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${40 + (i % 3) * 6}" fill="${o.hair}"/>`;
    }
    // textura de cachos
    const curls = [[66,200],[58,260],[70,320],[90,140]];
    const tex = curls.map(([x, y]) =>
      `<path d="M ${x-12} ${y} q 12 -16 24 0 q -12 16 -24 0" fill="none" stroke="${o.hairHi}" stroke-width="4" stroke-linecap="round"/>`).join('');
    const streaks = `
      <path d="M 74 168 C 48 208 88 244 60 286 C 40 318 82 346 60 392" fill="none" stroke="${o.streak}" stroke-width="11" stroke-linecap="round"/>
      <path d="M 44 236 C 30 270 52 300 36 340" fill="none" stroke="${o.streak}" stroke-width="8" stroke-linecap="round" opacity=".85"/>`;
    s += `<g>${tex}${streaks}</g><g ${MIRROR}>${tex}${streaks}</g>`;
  } else {
    s += `<ellipse cx="180" cy="180" rx="138" ry="128" fill="${o.hair}"/>`;
    for (let i = 0; i < 28; i++) {
      const a = i / 28 * Math.PI * 2;
      const x = 180 + 142 * Math.cos(a), y = 182 + 134 * Math.sin(a);
      s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${36 + (i % 4) * 4}" fill="${o.hair}"/>`;
    }
    for (let i = 0; i < 16; i++) {
      const a = i / 16 * Math.PI * 2;
      const x = 180 + 150 * Math.cos(a), y = 182 + 140 * Math.sin(a);
      s += `<path d="M ${(x-10).toFixed(1)} ${y.toFixed(1)} q 10 -13 20 0 q -10 13 -20 0" fill="none" stroke="${o.hairHi}" stroke-width="4" stroke-linecap="round"/>`;
    }
  }
  return s;
}

function hairFront(o) {
  if (o.type === 'long') {
    const lock = `
      <circle cx="84" cy="236" r="20" fill="${o.hair}"/>
      <circle cx="80" cy="276" r="20" fill="${o.hair}"/>
      <circle cx="86" cy="314" r="17" fill="${o.hair}"/>
      <path d="M 176 70 C 130 80 104 112 98 160 C 92 196 78 214 86 244 C 94 268 76 284 82 300" fill="none" stroke="${o.streak}" stroke-width="10" stroke-linecap="round"/>`;
    return `
      <path d="M 84 215 C 70 110 135 62 180 66 C 228 62 292 110 276 215 C 268 172 250 140 222 124 C 206 140 190 134 180 120 C 168 136 146 140 134 126 C 108 142 92 176 84 215 Z" fill="${o.hair}"/>
      <g>${lock}</g><g ${MIRROR}>${lock}</g>
      <path d="M 180 70 C 178 88 182 104 180 120" fill="none" stroke="${o.streak}" stroke-width="7" stroke-linecap="round"/>`;
  }
  const pts = [[92,178],[100,148],[118,124],[142,108],[168,101],[194,101],[220,108],[244,124],[262,148],[270,178],[84,208],[276,208]];
  return `<ellipse cx="180" cy="116" rx="106" ry="58" fill="${o.hair}"/>` +
    pts.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="22" fill="${o.hair}"/>`).join('');
}

function face(o, id) {
  const eyesOpen = (cx, side) => `
    <ellipse cx="${cx}" cy="200" rx="13" ry="16" fill="#2b1810"/>
    <circle cx="${cx - 4}" cy="194" r="5" fill="#fff"/>
    <circle cx="${cx + 5}" cy="206" r="2.2" fill="#fff"/>
    <path d="M ${cx + side*14} 192 l ${side*8} -7 M ${cx + side*13} 199 l ${side*9} -2" stroke="#2b1810" stroke-width="3" stroke-linecap="round"/>
    <path d="M ${cx - 15} 190 Q ${cx} 178 ${cx + 15} 190" fill="none" stroke="#2b1810" stroke-width="3.5" stroke-linecap="round"/>`;
  const eyesHappy = (cx, side) => `
    <path d="M ${cx - 17} 206 Q ${cx} 186 ${cx + 17} 206" fill="none" stroke="#1a0e08" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M ${cx + side*16} 200 l ${side*8} -6" stroke="#1a0e08" stroke-width="3" stroke-linecap="round"/>`;
  const blinkDelay = { laisa: -0.6, louise: -2.1, leticia: -3.3 }[id];
  const eyes = o.type === 'afro'
    ? `<g>${eyesHappy(145, -1)}${eyesHappy(215, 1)}</g>`
    : `<g ${st('180px 200px', anim('blink', 4.4, blinkDelay, 'infinite', 'none', 'linear'))}>${eyesOpen(145, -1)}${eyesOpen(215, 1)}</g>`;
  const brows = `
    <path d="M 124 170 Q 145 158 166 168" fill="none" stroke="${o.hair}" stroke-width="6" stroke-linecap="round"/>
    <path d="M 194 168 Q 215 158 236 170" fill="none" stroke="${o.hair}" stroke-width="6" stroke-linecap="round"/>`;
  const nose = `<path d="M 172 222 Q 180 236 190 227" fill="none" stroke="${o.shade}" stroke-width="3.5" stroke-linecap="round"/>`;
  const blush = `
    <ellipse cx="122" cy="240" rx="19" ry="11" fill="${o.blush}" opacity=".45"/>
    <ellipse cx="238" cy="240" rx="19" ry="11" fill="${o.blush}" opacity=".45"/>`;
  const mouth = o.type === 'afro'
    ? `<path d="M 146 246 Q 180 298 214 246 Q 180 253 146 246 Z" fill="#6b1f22"/>
       <path d="M 151 248 Q 180 256 209 248 L 205 260 Q 180 266 155 260 Z" fill="#fff"/>`
    : `<path d="M 160 253 Q 180 274 200 253 Q 180 261 160 253 Z" fill="#b5524f" stroke="#8a3a36" stroke-width="2" stroke-linejoin="round"/>`;
  return { eyes, brows, nose, blush, mouth };
}

function arm(o, cls) {
  const trim = o.trim ? `<path d="M 62 425 L 124 425" stroke="${o.trim}" stroke-width="7" stroke-linecap="round"/>` : '';
  return `<g class="${cls}">
    <rect x="76" y="380" width="42" height="140" rx="21" fill="${o.skin}"/>
    <circle cx="97" cy="522" r="22" fill="${o.skin}"/>
    <path d="M 64 374 C 66 342 122 338 128 368 L 124 425 L 62 425 Z" fill="${o.shirt}"/>
    ${trim}
  </g>`;
}

function overalls(o) {
  return `
    <path d="M 118 336 L 134 412" stroke="${o.overall}" stroke-width="24"/>
    <path d="M 242 336 L 226 412" stroke="${o.overall}" stroke-width="24"/>
    <path d="M 116 404 L 244 404 L 258 1100 L 102 1100 Z" fill="${o.overall}" stroke="${o.overall}" stroke-width="10" stroke-linejoin="round"/>
    <path d="M 124 412 L 236 412 L 249 1100 M 111 1100 L 124 412" fill="none" stroke="${o.overallDark}" stroke-width="2.5" stroke-dasharray="6 6"/>
    <rect x="148" y="432" width="64" height="56" rx="9" fill="${o.overall}" stroke="${o.overallDark}" stroke-width="3"/>
    <path d="M 148 446 L 212 446" stroke="${o.overallDark}" stroke-width="3"/>
    <circle cx="133" cy="410" r="9" fill="${o.overallDark}" stroke="#fff" stroke-opacity=".6" stroke-width="2"/>
    <circle cx="227" cy="410" r="9" fill="${o.overallDark}" stroke="#fff" stroke-opacity=".6" stroke-width="2"/>`;
}

function teddy() {
  return `
    <circle class="teddyGlow" cx="180" cy="465" r="78" fill="url(#gGlow)" ${st('180px 465px', anim('glow', 5, 20, 1, 'none', 'linear'))} opacity="0"/>
    <g>
      <ellipse cx="180" cy="512" rx="36" ry="32" fill="#b07a4a"/>
      <ellipse cx="180" cy="518" rx="20" ry="18" fill="#d9a877"/>
      <circle cx="151" cy="420" r="14" fill="#b07a4a"/><circle cx="151" cy="420" r="7" fill="#d9a877"/>
      <circle cx="209" cy="420" r="14" fill="#b07a4a"/><circle cx="209" cy="420" r="7" fill="#d9a877"/>
      <circle cx="180" cy="446" r="33" fill="#b07a4a"/>
      <ellipse cx="180" cy="458" rx="14" ry="10" fill="#e3c08f"/>
      <circle cx="168" cy="440" r="3.8" fill="#2b1810"/><circle cx="192" cy="440" r="3.8" fill="#2b1810"/>
      <ellipse cx="180" cy="453" rx="4.5" ry="3.2" fill="#2b1810"/>
      <path d="M 175 461 Q 180 466 185 461" fill="none" stroke="#2b1810" stroke-width="2" stroke-linecap="round"/>
      <ellipse cx="160" cy="452" rx="5" ry="3" fill="#e5786a" opacity=".5"/>
      <ellipse cx="200" cy="452" rx="5" ry="3" fill="#e5786a" opacity=".5"/>
      <path d="M 180 482 L 160 472 L 162 492 Z M 180 482 L 200 472 L 198 492 Z" fill="#8ec5e8" stroke="#6aa7cf" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="180" cy="482" r="5" fill="#6aa7cf"/>
    </g>`;
}

/**
 * Monta uma personagem com todas as animações já agendadas.
 * cfg: { enter, walk, hops:[t], talk:[t,dur], wave:{arm,t}, armsUp:[t], hug:t, jump:t }
 */
function character(id, x, cfg) {
  const o = CH[id];
  const f = face(o, id);
  const tiltDelay = { laisa: 0, louise: -1.3, leticia: -2.6 }[id];
  const tilt = anim('tilt', 4, tiltDelay, 'infinite');

  // braços: cada braço recebe uma lista de animações não sobrepostas
  const armAnims = { L: [], R: [] };
  if (cfg.wave) armAnims[cfg.wave.arm].push(anim('wave', 3, cfg.wave.t));
  if (cfg.hug != null) { armAnims.L.push(anim('hug', 2.6, cfg.hug)); armAnims.R.push(anim('hug', 2.6, cfg.hug)); }
  (cfg.armsUp || []).forEach(t => { armAnims.L.push(anim('armsUp', 2.6, t)); armAnims.R.push(anim('armsUp', 2.6, t)); });

  const mouthAnims = (cfg.talk || []).map(([t, d]) =>
    anim(o.type === 'afro' ? 'talkSmall' : 'talk', 0.18, t, Math.round(d / 0.18), 'none', 'ease-in-out', 'alternate'));
  const mouthOrigin = o.type === 'afro' ? '180px 248px' : '180px 254px';

  const jumpAnims = (cfg.hops || []).map(t => anim('hop', 0.7, t, 1, 'none', 'ease-out'));
  if (cfg.jump != null) jumpAnims.push(anim('jump', 0.8, cfg.jump, 3, 'none', 'ease-in-out'));

  const body = `
    <g ${st('180px 300px', tilt)}><g ${st('180px 210px', anim('sway', 3.4, tiltDelay, 'infinite'))}>${hairBack(o)}</g></g>
    <rect x="152" y="268" width="56" height="80" rx="14" fill="${o.shade}"/>
    <path d="M 66 1100 L 74 420 C 76 366 110 336 146 330 L 214 330 C 250 336 284 366 286 420 L 294 1100 Z" fill="${o.shirt}"/>
    <path d="M 148 330 Q 180 360 212 330 Z" fill="${o.shade}"/>
    ${o.trim ? `<path d="M 144 331 Q 180 364 216 331" fill="none" stroke="${o.trim}" stroke-width="8" stroke-linecap="round"/>` : ''}
    ${o.type === 'long' ? overalls(o) : teddy()}
    <g ${st('100px 368px', ...armAnims.L)}>${arm(o, 'armL')}</g>
    <g ${MIRROR}><g ${st('100px 368px', ...armAnims.R)}>${arm(o, 'armR')}</g></g>
    <g ${st('180px 300px', tilt)}>
      <ellipse cx="88" cy="212" rx="15" ry="20" fill="${o.skin}"/>
      <ellipse cx="272" cy="212" rx="15" ry="20" fill="${o.skin}"/>
      <ellipse cx="180" cy="195" rx="92" ry="102" fill="${o.skin}"/>
      ${hairFront(o)}
      ${f.brows}${f.eyes}${f.nose}${f.blush}
      <g ${st(mouthOrigin, ...mouthAnims)}>${f.mouth}</g>
    </g>`;

  let enter = '';
  if (cfg.enter === 'walkL') enter = st('0 0', anim('walkInL', 2, cfg.enterT, 1, 'backwards', 'cubic-bezier(.2,.7,.3,1)'));
  if (cfg.enter === 'hopR')  enter = st('0 0', anim('hopInR', 2, cfg.enterT, 1, 'backwards', 'linear'));
  if (cfg.enter === 'magic') enter = st('180px 430px', anim('magicIn', 1.2, cfg.enterT, 1, 'backwards', 'ease-out'));
  const exit = cfg.exit ? st('180px 430px', anim(cfg.exit.name, 0.6, cfg.exit.t, 1, 'forwards', 'ease-in')) : '';
  const sc = cfg.scale ?? 0.9, ty = cfg.y ?? 182;

  const walk = cfg.enter === 'walkL'
    ? st('0 0', anim('walkBounce', 0.4, cfg.enterT, 5, 'none', 'ease-in-out'))
    : '';

  return `<g transform="translate(${x - 180 * sc},${ty}) scale(${sc})"><g ${exit}>
    <g ${enter}><g ${walk}><g ${st('0 0', ...jumpAnims)}>
      <g ${st('0 0', anim('bob', 2.6, tiltDelay, 'infinite'))}>${body}</g>
    </g></g></g>
  </g></g>`;
}

// ---------- Elementos de cena ----------
const STAR = 'M0 -16 Q2.4 -2.4 16 0 Q2.4 2.4 0 16 Q-2.4 2.4 -16 0 Q-2.4 -2.4 0 -16 Z';
const HEART = 'M0 8 C -14 -4 -6 -16 0 -8 C 6 -16 14 -4 0 8 Z';

function bubble(x, y, w, h, tail, lines, color, t, dur, origin) {
  const [tx1, tx2, tipX, tipY] = tail;
  const fs = 36, lh = 44;
  const ty0 = y + h / 2 - ((lines.length - 1) * lh) / 2 + 12;
  const txt = lines.map((l, i) =>
    `<text x="${x + w / 2}" y="${ty0 + i * lh}" text-anchor="middle" font-size="${fs}" fill="${color}">${l}</text>`).join('');
  return `<g class="hidden0" ${st(origin, anim('life', dur, t, 1, 'none', 'ease-out'))}>
    <path d="M ${tx1} ${y + h - 4} L ${tipX} ${tipY} L ${tx2} ${y + h - 4} Z" fill="#fff" stroke="${color}" stroke-width="5" stroke-linejoin="round"/>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="40" fill="#fff" stroke="${color}" stroke-width="5"/>
    <path d="M ${tx1 + 4} ${y + h - 3} L ${tx2 - 4} ${y + h - 3}" stroke="#fff" stroke-width="8"/>
    ${txt}
  </g>`;
}

function nameTag(x, label, color, t, y = 652, life = null) {
  const w = label.length * 22 + 50;
  const a = life ? anim('life', life, t, 1, 'none', 'ease-out') : anim('popIn', 0.6, t, 1, 'forwards', 'ease-out');
  return `<g class="hidden0" ${st(`${x}px ${y + 26}px`, a)}>
    <rect x="${x - w / 2}" y="${y}" width="${w}" height="52" rx="26" fill="${color}" stroke="#fff" stroke-width="4"/>
    <text x="${x}" y="${y + 37}" text-anchor="middle" font-size="34" fill="#fff">${label}</text>
  </g>`;
}

// Fundo, nuvens e estrelinhas (comuns aos dois formatos)
function backdrop(W, H, clouds, twk, dots) {
  let s = `<defs>
    <linearGradient id="gTitle" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cbb6ef"/><stop offset=".5" stop-color="#f6e7c4"/><stop offset="1" stop-color="#f9b9d6"/></linearGradient>
    <linearGradient id="gLaisa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9c8f5"/><stop offset="1" stop-color="#b9a0e6"/></linearGradient>
    <linearGradient id="gLouise" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf0d6"/><stop offset="1" stop-color="#f2dca8"/></linearGradient>
    <linearGradient id="gLeticia" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fcd2e4"/><stop offset="1" stop-color="#f4a6c8"/></linearGradient>
    <linearGradient id="gAll" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cdb8f0"/><stop offset=".5" stop-color="#f8e8c6"/><stop offset="1" stop-color="#f9bcd8"/></linearGradient>
    <radialGradient id="gGlow"><stop offset="0" stop-color="#fff6b0" stop-opacity="1"/><stop offset=".6" stop-color="#ffe17a" stop-opacity=".55"/><stop offset="1" stop-color="#ffd35a" stop-opacity="0"/></radialGradient>
    <radialGradient id="gFlash"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#fff3b8" stop-opacity=".8"/><stop offset="1" stop-color="#ffe58a" stop-opacity="0"/></radialGradient>
  </defs>`;

  // Fundos (cada cena entra por cima da anterior)
  s += `<rect width="${W}" height="${H}" fill="url(#gTitle)"/>`;
  [['gLaisa', 4], ['gLouise', 11], ['gLeticia', 18], ['gAll', 26]].forEach(([g, t]) => {
    s += `<rect width="${W}" height="${H}" fill="url(#${g})" class="hidden0" style="animation:${anim('fadeIn', 1, t, 1, 'both', 'ease-in-out')}"/>`;
  });

  // Bolinhas suaves e nuvens
  dots.forEach(([x, y, r]) => {
    s += `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" opacity=".22"/>`;
  });
  clouds.forEach(([x, y, d]) => {
    s += `<g transform="translate(${x},${y})"><g ${st('0 0', anim('drift', 9, d, 'infinite'))}>
      <ellipse cx="0" cy="0" rx="70" ry="26" fill="#fff" opacity=".75"/>
      <ellipse cx="-30" cy="-14" rx="34" ry="26" fill="#fff" opacity=".75"/>
      <ellipse cx="22" cy="-20" rx="38" ry="30" fill="#fff" opacity=".75"/></g></g>`;
  });
  // Estrelinhas piscando
  twk.forEach(([x, y], i) => {
    s += `<g transform="translate(${x},${y}) scale(${0.6 + (i % 3) * 0.25})"><path d="${STAR}" fill="#fff" ${st('0 0', anim('twinkle', 2.2 + (i % 4) * 0.4, -i * 0.37, 'infinite'))}/></g>`;
  });
  return s;
}

function magicBurst(cx, cy) {
  let s = `<circle cx="${cx}" cy="${cy}" r="160" fill="url(#gFlash)" class="hidden0" ${st(`${cx}px ${cy}px`, anim('flash', 1.3, 18.2, 1, 'none', 'ease-out'))}/>`;
  for (let i = 0; i < 12; i++) {
    const col = ['#fff3a0', '#ffffff', '#ffc2dc', '#bfe3f2'][i % 4];
    s += `<g transform="translate(${cx},${cy}) rotate(${i * 30})"><g class="hidden0" ${st('0 0', anim('burstOut', 1.5, 18.3 + (i % 3) * 0.08, 1, 'none', 'ease-out'))}><path d="${STAR}" fill="${col}"/></g></g>`;
  }
  return s;
}

function heartRain(W, n) {
  const hc = ['#f19bc1', '#8fc6dc', '#b48be0', '#f8e27a', '#ef8db0', '#ffffff'];
  let s = '';
  for (let i = 0; i < n; i++) {
    const x = 20 + ((i * 397) % (W - 40));
    const sc = 2 + (i % 4) * 0.6;
    const dur = 3.2 + (i % 5) * 0.5;
    const delay = 26.2 + (i % 9) * 0.35 + Math.floor(i / 9) * 0.2;
    s += `<g transform="translate(${x},0) scale(${sc})"><g class="hidden0" ${st('0 0', anim('fall', dur * (W < 1000 ? 1.5 : 1), delay, 'infinite', 'none', 'linear'))}><path d="${HEART}" fill="${hc[i % hc.length]}" stroke="#fff" stroke-width="1"/></g></g>`;
  }
  return s;
}

// ---------- Formato horizontal 16:9 (YouTube) ----------
function buildHorizontal() {
  let s = backdrop(1280, 720,
    [[260, 110, -1], [1000, 80, -4]],
    [[80, 300], [1210, 330], [470, 60], [820, 150], [1120, 560], [60, 520], [700, 40], [380, 200], [1240, 60], [930, 300]],
    [[120, 120, 90], [1160, 160, 110], [980, 600, 140], [200, 620, 120], [640, 90, 70]]);

  // Título (0–4s)

    <text x="640" y="290" text-anchor="middle" font-size="104" fill="#fff" stroke="#8b5cc7" stroke-width="14" paint-order="stroke" stroke-linejoin="round">Laisa, Louise</text>

  // Clarão e explosão de estrelas da Letícia
  s += magicBurst(640, 440);

  // Personagens
  s += character('laisa', 250, {

  s += character('leticia', 640, {

  // Plaquinhas com os nomes
  s += nameTag(250, 'Laisa', '#9b72d4', 5.6);

  s += bubble(310, 50, 600, 130, [800, 860, 920, 235], ['E eu sou a Louise!', 'Vamos inventar uma brincadeira?'], '#d9a21f', 13.2, 4.8, '880px 220px');
  s += bubble(330, 24, 620, 130, [610, 670, 640, 200], ['E eu sou a Letícia!', 'Um abraço deixa tudo mágico!'], '#e46d9f', 20.2, 5.3, '640px 190px');

  // Faixas finais
  s += `<g class="hidden0" ${st('640px 100px', anim('life', 4, 26.4, 1, 'none', 'ease-out'))}>
    <rect x="250" y="44" width="780" height="112" rx="56" fill="#fff" stroke="#e46d9f" stroke-width="6"/>
    <text x="640" y="119" text-anchor="middle" font-size="60" fill="#8b5cc7">Juntas somos incríveis!</text>
  </g>`;
  s += `<g class="hidden0" ${st('640px 100px', anim('popIn', 0.7, 30.4, 1, 'forwards', 'ease-out'))}>
    <rect x="230" y="44" width="820" height="112" rx="56" fill="#fff" stroke="#8b5cc7" stroke-width="6"/>
    <rect x="270" y="70" width="86" height="60" rx="16" fill="#ff3b3b"/>
    <path d="M 302 86 L 330 100 L 302 114 Z" fill="#fff"/>
    <text x="690" y="119" text-anchor="middle" font-size="54" fill="#e46d9f">Inscreva-se no canal!</text>
  </g>`;

  // Chuva de corações (a partir de 26.2s)
  s += heartRain(1280, 34);
  return s;
}

// ---------- Formato vertical 9:16 (Shorts / Reels / TikTok) ----------
// Cada personagem aparece sozinha e grande; no final as três se juntam.
// Textos ficam longe das bordas de baixo e da direita (onde ficam os botões do app).
function buildVertical() {
  const SOLO = { scale: 1.4, y: 360 };
  let s = backdrop(720, 1280,
    [[170, 120, -1], [560, 230, -4], [150, 1000, -6]],
    [[60, 300], [660, 420], [300, 80], [620, 120], [80, 760], [650, 860], [420, 1180], [90, 1180], [380, 560], [600, 640]],
    [[100, 180, 90], [640, 360, 110], [620, 1080, 140], [80, 940, 120], [380, 60, 70]]);

  // Título (0–4s)
  s += `<g class="hidden0" ${st('360px 560px', anim('life', 4.2, 0, 1, 'none', 'ease-out'))}>
    <text x="360" y="470" text-anchor="middle" font-size="112" fill="#fff" stroke="#8b5cc7" stroke-width="14" paint-order="stroke" stroke-linejoin="round">Laisa,</text>
    <text x="360" y="580" text-anchor="middle" font-size="112" fill="#fff" stroke="#e7b93b" stroke-width="14" paint-order="stroke" stroke-linejoin="round">Louise</text>
    <text x="360" y="690" text-anchor="middle" font-size="112" fill="#fff" stroke="#e46d9f" stroke-width="14" paint-order="stroke" stroke-linejoin="round">&amp; Letícia</text>
    <text x="360" y="770" text-anchor="middle" font-size="36" fill="#6b4a9a">Episódio 1 · As Três Amigas Mágicas</text>
    <circle cx="300" cy="830" r="14" fill="#8fc6dc"/><circle cx="360" cy="830" r="14" fill="#ef8db0"/><circle cx="420" cy="830" r="14" fill="#b07a4a"/>
  </g>`;

  s += magicBurst(360, 640);

  // Cenas solo (personagem grande no centro)
  s += character('laisa', 360, { ...SOLO, enter: 'walkL', enterT: 4, talk: [[6.3, 2.6]], wave: { arm: 'R', t: 6.1 }, exit: { name: 'exitL', t: 10.4 } });
  s += character('louise', 360, { ...SOLO, enter: 'hopR', enterT: 11, talk: [[13.3, 2.6]], wave: { arm: 'L', t: 13.1 }, exit: { name: 'exitR', t: 17.4 } });
  s += character('leticia', 360, { ...SOLO, enter: 'magic', enterT: 18.5, talk: [[20.3, 2.9]], hug: 20.1, exit: { name: 'exitPop', t: 25.4 } });

  // Final: as três juntas (Letícia atrás no meio, Laisa e Louise na frente)
  const back = { scale: 0.8, y: 464, enter: 'magic', jump: 26.2, armsUp: [26.2], talk: [[26.6, 1.4]] };
  const front = { scale: 0.8, y: 760, enter: 'magic', jump: 26.2, armsUp: [26.2], talk: [[26.6, 1.4]] };
  s += character('leticia', 360, { ...back, enterT: 25.6 });
  s += character('laisa', 196, { ...front, enterT: 25.75 });
  s += character('louise', 524, { ...front, enterT: 25.9 });

  // Nomes (solo) e nomes finais
  s += nameTag(360, 'Laisa', '#9b72d4', 5.6, 1010, 4.8);
  s += nameTag(360, 'Louise', '#e7b93b', 12.6, 1010, 4.8);
  s += nameTag(360, 'Letícia', '#e46d9f', 19.6, 1010, 5.8);

  // Balões de fala
  s += bubble(50, 150, 620, 150, [330, 390, 300, 400], ['Oi! Eu sou a Laisa!', 'Bora viver uma aventura?'], '#8b5cc7', 6.2, 4.2, '320px 380px');
  s += bubble(50, 150, 620, 150, [330, 390, 420, 400], ['E eu sou a Louise!', 'Vamos inventar uma brincadeira?'], '#d9a21f', 13.2, 4.2, '400px 380px');
  s += bubble(50, 150, 620, 150, [330, 390, 360, 400], ['E eu sou a Letícia!', 'Um abraço deixa tudo mágico!'], '#e46d9f', 20.2, 5.0, '360px 380px');

  // Faixas finais
  s += `<g class="hidden0" ${st('360px 300px', anim('life', 4, 26.4, 1, 'none', 'ease-out'))}>
    <rect x="50" y="210" width="620" height="180" rx="60" fill="#fff" stroke="#e46d9f" stroke-width="6"/>
    <text x="360" y="288" text-anchor="middle" font-size="62" fill="#8b5cc7">Juntas somos</text>
    <text x="360" y="358" text-anchor="middle" font-size="62" fill="#8b5cc7">incríveis!</text>
  </g>`;
  s += `<g class="hidden0" ${st('360px 300px', anim('popIn', 0.7, 30.4, 1, 'forwards', 'ease-out'))}>
    <rect x="50" y="210" width="620" height="180" rx="60" fill="#fff" stroke="#8b5cc7" stroke-width="6"/>
    <text x="360" y="288" text-anchor="middle" font-size="56" fill="#e46d9f">Siga para ver</text>
    <text x="360" y="356" text-anchor="middle" font-size="56" fill="#e46d9f">mais aventuras!</text>
  </g>`;

  s += heartRain(720, 26);
  return s;
}

// ---------- Escolha do formato ----------
const params = new URLSearchParams(location.search);
const VERTICAL = params.get('formato') === 'vertical';
const svgEl = document.getElementById('svg');
if (VERTICAL) {
  document.body.classList.add('vertical');
  svgEl.setAttribute('viewBox', '0 0 720 1280');
}
svgEl.innerHTML = VERTICAL ? buildVertical() : buildHorizontal();

// ---------- Controles (WAAPI) ----------
const RENDER = params.has('render');
if (RENDER) document.body.classList.add('render');
document.getElementById(VERTICAL ? 'fmtV' : 'fmtH').setAttribute('aria-current', 'page');

const all = () => document.getAnimations();
// Define o tempo global (em segundos) de toda a animação
window.seek = (t) => { all().forEach(a => { a.pause(); a.currentTime = t * 1000; }); };
window.TOTAL = TOTAL;

if (!RENDER) {
  const playBtn = document.getElementById('play');
  const scrub = document.getElementById('scrub');
  const timeEl = document.getElementById('time');
  let playing = true, base = performance.now(), offset = 0, scrubbing = false;
  const now = () => playing ? offset + (performance.now() - base) / 1000 : offset;

  const setPlaying = (p) => {
    if (p === playing) return;
    if (p) { base = performance.now(); all().forEach(a => a.play()); }
    else { offset = now(); all().forEach(a => a.pause()); }
    playing = p; playBtn.textContent = p ? 'Pausar' : 'Tocar';
  };
  const jumpTo = (t) => {
    offset = t; base = performance.now();
    all().forEach(a => { a.currentTime = t * 1000; if (playing) a.play(); else a.pause(); });
  };
  playBtn.onclick = () => {
    if (!playing && now() >= TOTAL) jumpTo(0);
    setPlaying(!playing);
  };
  document.getElementById('replay').onclick = () => { jumpTo(0); setPlaying(true); };
  scrub.addEventListener('input', () => { scrubbing = true; setPlaying(false); jumpTo(+scrub.value); });
  scrub.addEventListener('change', () => { scrubbing = false; });

  (function tick() {
    let t = now();
    if (t >= TOTAL && playing) { setPlaying(false); offset = TOTAL; jumpTo(TOTAL); t = TOTAL; }
    if (!scrubbing) scrub.value = t;
    timeEl.textContent = `${t.toFixed(1)}s / ${TOTAL}s`;
    requestAnimationFrame(tick);
  })();
}
</script>
